[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learning_augmented_portfolio"
version = "0.1.0"
description = "Certified Learning-Augmented Multi-Period Portfolio Rebalancing with Mixed-Integer Transaction Costs and Liquidity Constraints"
authors = [{ name = "Quantitative Optimization Research" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gurobipy>=11.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
